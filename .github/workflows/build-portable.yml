# Builds the portable Windows app: one GetHubWatchDog.exe with Python and
# everything else inside, so it runs from a USB stick on any Windows PC.
# Each build is test-launched on Windows, then published as a GitHub Release.
name: Build portable app
on:
  push:
    branches: [main]
    paths:
      - gethub_watchdog.py
      - watchdog.ico
      - PORTABLE-README.txt
      - LICENSE.md
      - .github/workflows/build-portable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PyInstaller
      run: python -m pip install --upgrade pip pyinstaller
    - name: Build GetHubWatchDog.exe
      run: python -m PyInstaller --noconfirm --onefile --windowed --name GetHubWatchDog --icon watchdog.ico --add-data "watchdog.ico;." gethub_watchdog.py
    - name: Test-launch the app on Windows
      shell: pwsh
      run: |
        $p = Start-Process -FilePath dist\GetHubWatchDog.exe -ArgumentList '--selftest' -PassThru
        if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "The app did not start and close as expected." }
        if (-not (Test-Path dist\selftest-result.txt)) { throw "The app did not write its self-test result." }
        Get-Content dist\selftest-result.txt
        if (-not (Select-String -Path dist\selftest-result.txt -Pattern '^ok .*portable=True' -Quiet)) { throw "Self-test failed." }
        Remove-Item dist\selftest-result.txt, dist\GetHubWatchDog-settings.json -ErrorAction SilentlyContinue
    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory GetHubWatchDog-Portable | Out-Null
        Copy-Item dist\GetHubWatchDog.exe GetHubWatchDog-Portable\
        Copy-Item PORTABLE-README.txt "GetHubWatchDog-Portable\READ ME FIRST.txt"
        Copy-Item LICENSE.md GetHubWatchDog-Portable\LICENSE.md
        Compress-Archive -Path GetHubWatchDog-Portable -DestinationPath GetHubWatchDog-Portable.zip
        Get-ChildItem GetHubWatchDog-Portable, GetHubWatchDog-Portable.zip
    - name: Update the portable folder in the repository
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force portable | Out-Null
        Copy-Item dist\GetHubWatchDog.exe portable\ -Force
        Copy-Item PORTABLE-README.txt "portable\READ ME FIRST.txt" -Force
        Copy-Item LICENSE.md portable\LICENSE.md -Force
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add portable
        git diff --cached --quiet
        if ($LASTEXITCODE -eq 0) { Write-Host "Portable folder already up to date"; exit 0 }
        git commit -m "Update portable GetHubWatchDog.exe (build ${{ github.run_number }}) [skip ci]"
        git pull --rebase origin main
        git push origin HEAD:main
    - uses: actions/upload-artifact@v4
      with:
        name: GetHubWatchDog-Portable
        path: GetHubWatchDog-Portable
    - name: Publish release
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ver = (Select-String -Path gethub_watchdog.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
        $tag = "v$ver-build${{ github.run_number }}"
        $notes = "Portable Windows version of GetHub WatchDog $ver. No Python or install needed.`n`n" +
                 "Download **GetHubWatchDog-Portable.zip**, unzip it onto your USB stick (or any folder) and double-click **GetHubWatchDog.exe**. " +
                 "Settings are saved next to the app, not on the PC.`n`n" +
                 "If Windows shows 'Windows protected your PC', click **More info** then **Run anyway** (the app is not code-signed).`n`n" +
                 "Free for noncommercial use under the [PolyForm Noncommercial License 1.0.0](https://github.com/WhiteBoyStudios/GetHub-WatchDog/blob/main/LICENSE.md). Commercial use requires permission from WhiteBoyStudios."
        gh release create $tag GetHubWatchDog-Portable.zip dist\GetHubWatchDog.exe --target ${{ github.sha }} --title "GetHub WatchDog $ver portable (build ${{ github.run_number }})" --notes $notes --latest
